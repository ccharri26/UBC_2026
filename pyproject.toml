[project]
name = "pennywise"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.14.0",
    "fastapi[standard]>=0.162.7",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pennywise"]
